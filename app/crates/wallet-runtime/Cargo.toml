[workspace]

[package]
autobins = false
name = "autopilot-recovery-lab"
version = "0.3.1"
edition = "2021"
license = "MIT"
description = "AutoPilot wallet host, recovery, payments and security runtime"

[dependencies]
autopilot-wallet-lab = { path = "../wallet-rpc" }
autopilot-privacy = { path = "../autopilot-privacy" }
monero-autopilot-core = { path = "../monero-autopilot-core" }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync", "signal", "process"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
zeroize = "1"
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
subtle = "2.6"

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json"] }
digest_auth = "0.3"
sha3 = "0.10"
data-encoding = "2"

[profile.release]
opt-level = "s"
strip = true
